(function(){

const defaults=()=>[{id:'eating',name:'Eating out',mode:'budget',limit:50,active:true,color:COLORS[0]},{id:'groceries',name:'Groceries & household basics',mode:'budget',limit:35,active:true,color:COLORS[1]},{id:'shopping',name:'Discretionary shopping',mode:'budget',limit:0,active:true,color:COLORS[2]},{id:'other',name:'Other / unplanned expenses',mode:'tracking',limit:0,active:true,color:COLORS[3]}];

 if(!raw||typeof raw!=='object'||!Array.isArray(raw.entries)||!raw.plans||typeof raw.plans!=='object'||Array.isArray(raw.plans)||raw.entries.length>20000)throw Error('Unsupported budget data.');

 const plans={};for(const [m,p] of Object.entries(raw.plans)){if(!/^\d{4}-\d{2}$/.test(m)||!p||typeof p!=='object')continue;plans[m]={opening:p.opening==null?null:num(p.opening),startDate:p.startDate||m+'-01',bills:num(p.bills),loan:num(p.loan),cushion:num(p.cushion),expectedIncome:0,limits:{food:num(p.budgets?.food),discretionary:num(p.budgets?.discretionary),transport:num(p.budgets?.transport),other:num(p.budgets?.other)},confirmed:true};}

function validate(d){const x=migrate(d);if(x.categories.length>100||x.entries.length>20000||x.receivables.length>10000)throw Error('Data limit exceeded.');const ids=new Set();for(const c of x.categories){if(!c||typeof c.id!=='string'||!/^[-\w]{1,100}$/.test(c.id)||ids.has(c.id)||typeof c.name!=='string'||c.name.length>90||!['budget','tracking'].includes(c.mode))throw Error('Invalid category.');ids.add(c.id);}for(const e of x.entries){if(!e||!TYPES[e.type]||typeof e.id!=='string'||!/^(\d{4})-\d\d-\d\d$/.test(e.date)||!Number.isFinite(Number(e.amount))||Number(e.amount)<=0||typeof e.note!=='string')throw Error('Invalid transaction.');}for(const r of x.receivables){if(!r||typeof r.id!=='string'||typeof r.note!=='string'||!Number.isFinite(Number(r.amount))||Number(r.amount)<=0||!['open','received'].includes(r.status))throw Error('Invalid reimbursement.');}return x;}

async function commit(mutator){if(busy)return;busy=true;const prev=data;try{const next=structuredClone(data);mutator(next);validate(next);const vault=await encrypt(next,key,salt);localStorage.setItem(VAULT_KEY,JSON.stringify(vault));data=next;message='';render();}catch(err){data=prev;alert('Not saved: '+err.message+' Your previous encrypted data remains intact.');}finally{busy=false;}}
async function unlock(password){const v=getVault();if(!v)throw Error('No encrypted vault found.');const r=await decrypt(v,password);key=r.key;salt=from64(v.salt);data=r.data;unlocked=true;authError='';scheduleLock();render();}
async function create(password,confirmation){if(localStorage.getItem(VAULT_KEY))throw Error('A vault already exists. Unlock it instead.');if(password.length<14||password!==confirmation)throw Error('Passwords must match and contain at least 14 characters.');const prior=localStorage.getItem(OLD_KEY);const initial=prior?validate(JSON.parse(prior)):blank();const newSalt=crypto.getRandomValues(new Uint8Array(16)),newKey=await derive(password,newSalt),v=await encrypt(initial,newKey,newSalt);const verified=await decrypt(v,password);if(JSON.stringify(verified.data)!==JSON.stringify(initial))throw Error('Encryption verification failed.');localStorage.setItem(VAULT_KEY,JSON.stringify(v));localStorage.removeItem(OLD_KEY);data=initial;key=newKey;salt=newSalt;unlocked=true;scheduleLock();render();}
function plan(m=month){return data.plans[m]||null;}
function suggested(m){const previous=data.plans[moveMonth(m,-1)];const limits={};for(const c of data.categories)limits[c.id]=previous?.limits?.[c.id]??c.limit??0;return {opening:null,startDate:m===nowMonth()?iso():m+'-01',bills:0,loan:m==='2026-10'?0:500,cushion:m==='2026-10'?0:150,expectedIncome:0,limits,confirmed:false};}
function activePlan(){return plan()||suggested(month);}
function rows(m=month){const p=plan(m);if(!p)return[];return data.entries.filter(e=>e.date.slice(0,7)===m&&e.date>=p.startDate);}
function stats(m=month){const p=plan(m)||suggested(m),rs=rows(m);let incomes=0,bills=0,reserve=0,expenses=0,spent={},received=0;for(const c of data.categories)spent[c.id]=0;for(const e of rs){if(e.type==='income')incomes+=e.amount;if(e.type==='reimbursement'){incomes+=e.amount;received+=e.amount;}if(e.type==='bill')bills+=e.amount;if(e.type==='reserve')reserve+=e.amount;if(e.type==='expense'){expenses+=e.amount;spent[e.category]=(spent[e.category]||0)+e.amount;}}
 // Only reimbursements tied to a purchase restore that purchase's category allowance.
 // Standalone pre-tracking receivables increase cash but cannot restore an untracked category.
 for(const r of data.receivables){
  if(!r.entryId)continue;
  const purchase=data.entries.find(e=>e.id===r.entryId&&e.type==='expense');
  const repayments=rs.filter(e=>e.type==='reimbursement'&&e.linkId===r.id);
  if(!purchase||!rs.some(e=>e.id===purchase.id)||!repayments.length)continue;
  const repaid=round(repayments.reduce((sum,e)=>sum+num(e.amount),0));
  spent[purchase.category]=round((spent[purchase.category]||0)-Math.min(num(r.amount),num(purchase.amount),repaid));
 }
 const balance=p.opening==null?null:round(p.opening+incomes-expenses-bills-reserve);
 const unpaid=Math.max(0,round(num(p.bills)-bills)),unreserved=Math.max(0,round(num(p.loan)-reserve));
 const futureIncome=Math.max(0,round(num(p.expectedIncome)-incomes+received)); // reimbursements do not satisfy ordinary income expectations
 const allowanceRemaining=data.categories.filter(c=>c.active&&c.mode==='budget').reduce((a,c)=>a+Math.max(0,round(num(p.limits?.[c.id])-num(spent[c.id]))),0);
 const afterCommitments=balance===null?null:round(balance-unpaid-unreserved);
 const projected=balance===null?null:round(balance+futureIncome-unpaid-unreserved-allowanceRemaining);
 return {p,rs,incomes,bills,reserve,expenses,spent,balance,unpaid,unreserved,futureIncome,allowanceRemaining,afterCommitments,projected};}
function repaidAmount(r){return round(data.entries.filter(e=>e.type==='reimbursement'&&e.linkId===r.id).reduce((sum,e)=>sum+num(e.amount),0));}
function remainingOwed(r){return Math.max(0,round(num(r.amount)-repaidAmount(r)));}
function owed(){return data.receivables.filter(r=>r.status==='open'&&remainingOwed(r)>0);}
function reimbursementHistory(){return data.receivables.filter(r=>repaidAmount(r)>0).slice().reverse();}
function ico(n){return ({home:'⌂',activity:'☷',plan:'⚙',plus:'+',back:'‹',next:'›'}[n]||'•');}
function top(){return `<div class="mast"><div class="brand"><div class="brandmark">↗</div>Clearledger <span class="pill">v${VERSION}</span></div><div class="vaultmeta"><span class="tag">ENCRYPTED · LOCAL</span><button class="lockbtn" data-action="lock">Lock</button></div></div><div class="intro"><div><div class="small">MONTHLY CASH FLOW</div><h1>${view==='home'?'Your money, clearly.':view==='activity'?'Activity & reimbursements':view==='categories'?'Manage categories':'Monthly plan'}</h1><p class="sub">${view==='home'?'Separate cash, obligations, and spending limits.':view==='categories'?'Edit categories here—no code changes required.':'Track what is planned and what actually happens.'}</p></div><div class="month-nav"><button class="iconbtn" data-action="prev" aria-label="Previous month">‹</button><strong>${monthLabel(month)}</strong><button class="iconbtn" data-action="next" aria-label="Next month">›</button></div></div>`;}
function notice(){if(plan(month))return '';const prior=plan(moveMonth(month,-1));return `<div class="notice warn"><strong>${prior?'New month ready for review.':'Set up this month.'}</strong> ${prior?'We copied last month’s suggested category limits. Confirm your current checking balance, expected income, bills, loan transfer, and limits before recording entries.':'Enter the checking balance as of the day you begin tracking. Do not reconstruct earlier purchases.'} <button class="tinybtn" data-action="plan">Open monthly plan →</button></div>`;}
function catRows(s){return data.categories.filter(c=>c.active).map(c=>{const limit=num(s.p.limits?.[c.id]),spent=num(s.spent[c.id]),remaining=round(limit-spent),pct=limit>0?Math.min(100,spent/limit*100):0;return `<div class="budgetrow"><div class="budgettop"><div class="budgetname"><span class="dot" style="background:${esc(c.color||COLORS[0])}"></span>${esc(c.name)} <span class="pill">${c.mode==='tracking'?'Tracking only':'Budgeted'}</span></div><div class="budgetnums ${c.mode==='budget'&&remaining<0?'negative':''}">${c.mode==='tracking'?'No allowance':money(remaining)+' left'}</div></div>${c.mode==='budget'?`<div class="track"><div class="fill" style="width:${pct}%;background:${esc(c.color||COLORS[0])}"></div></div>`:''}<div class="budgetfine">${money(spent)} recorded${c.mode==='budget'?' of '+money(limit)+' limit':''}</div></div>`;}).join('')||'<div class="empty">No active categories.</div>';}
function home(){const s=stats(),ready=s.balance!==null;return `${notice()}<div class="dash-grid"><div class="card hero"><div class="eyebrow">PROJECTED MONTH-END SURPLUS</div><div class="big">${ready?money(s.projected):'—'}</div><div class="foot">After expected remaining income, unpaid bills, planned loan transfer, and unused budgeted allowances. Tracking-only purchases are not forecast.</div><div class="hero-actions"><button class="btn" data-action="add">+ Add entry</button><button class="btn outline" data-action="plan">Edit plan</button></div></div><div class="kpis"><div class="card kpi"><div class="label">Estimated checking</div><div class="figure">${ready?money(s.balance):'—'}</div><div class="small">From your entered balance and recorded activity</div></div><div class="card kpi"><div class="label">After unpaid obligations</div><div class="figure">${ready?money(s.afterCommitments):'—'}</div><div class="small">Before future income or spending</div></div></div></div>
 <div class="grid2"><div class="card"><div class="sectionhead"><h2>Spending allowances</h2><button class="btn secondary sm" data-action="categories">Manage</button></div>${catRows(s)}</div><div class="card"><div class="sectionhead"><h2>Monthly outlook</h2><button class="btn secondary sm" data-action="plan">Adjust</button></div><div class="breakdown"><span>Estimated checking</span><strong>${ready?money(s.balance):'—'}</strong><span>Expected income still to arrive</span><strong>+${money(s.futureIncome)}</strong><span>Unpaid bills</span><strong>−${money(s.unpaid)}</strong><span>Live Oak transfer still planned</span><strong>−${money(s.unreserved)}</strong><span>Unused spending allowances</span><strong>−${money(s.allowanceRemaining)}</strong><span><b>Projected surplus</b></span><strong class="${s.projected!==null&&s.projected<s.p.cushion?'progresswarn':''}">${ready?money(s.projected):'—'}</strong><span>Surplus target</span><strong>${money(s.p.cushion)}</strong></div><hr class="sep"><p class="caption">${!ready?'Set a checking balance to calculate a projection.':s.projected>=s.p.cushion?'On track relative to your entered assumptions.':'Below your target based on entered assumptions.'} A forecast is not a live bank balance or a guarantee. Reimbursements increase checking only when received; linked repayments also restore the corresponding category allowance. They are not ordinary income.</p></div></div><div class="card" style="margin-top:16px"><div class="sectionhead"><h2>Recent entries</h2><button class="btn secondary sm" data-action="activity">See all</button></div>${entryList(s.rs.slice().sort(sortEntries).slice(0,5),false)}</div>`;}
const sortEntries=(a,b)=>b.date.localeCompare(a.date)||String(b.created||'').localeCompare(String(a.created||''));
function entryList(es,editable){if(!es.length)return '<div class="empty">No entries recorded for this month.</div>';return `<div class="list">${es.map(e=>{const plus=['income','reimbursement'].includes(e.type);const c=data.categories.find(c=>c.id===e.category);return `<div class="transrow"><div class="txicon">${plus?'↙':'↗'}</div><div class="txbody"><div class="txname">${esc(e.note||TYPES[e.type])}</div><div class="txmeta">${esc(e.date)} · ${esc(e.type==='expense'?(c?.name||'Archived category'):TYPES[e.type])}</div></div><div class="txamount ${plus?'txpos':''}">${plus?'+':'−'}${money(e.amount)}${editable?`<div><button class="tinybtn" data-action="delete-entry" data-id="${esc(e.id)}">Delete</button></div>`:''}</div></div>`;}).join('')}</div>`;}
function activity(){const s=stats();const es=s.rs.slice().sort(sortEntries).filter(e=>filter==='all'||e.type===filter);return `${notice()}<div class="summarymini"><div class="card"><span>Received</span><strong>${money(s.incomes)}</strong></div><div class="card"><span>Purchases & bills</span><strong>${money(s.expenses+s.bills)}</strong></div><div class="card"><span>Loan transfers</span><strong>${money(s.reserve)}</strong></div></div><div class="grid2"><div class="card"><div class="sectionhead"><h2>Transactions</h2><button class="btn sm" data-action="add">+ Add</button></div><div class="field" style="margin-bottom:15px"><label for="filter">Filter</label><select id="filter"><option value="all">All</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div>${entryList(es,true)}</div><div class="card"><div class="sectionhead"><h2>Reimbursements owed</h2><button class="btn secondary sm" data-action="add-owed">+ Add owed</button></div>${owed().length?owed().map(r=>`<div class="rowline"><div><b>${esc(r.note)}</b><div class="small">${money(remainingOwed(r))} remaining of ${money(r.amount)} · ${esc(r.date||'Earlier')}</div></div><div class="actions"><button class="btn sm" data-action="receive" data-id="${esc(r.id)}">Received</button><button class="btn secondary sm" data-action="remove-owed" data-id="${esc(r.id)}">Remove</button></div></div>`).join(''):'<div class="empty">No outstanding reimbursements.</div>'}<p class="caption">Record an amount owed even if you paid it before tracking began. That does not deduct the purchase again. Tap Received to enter the amount actually repaid. Partial payments leave the balance owed open.</p><hr class="sep"><h2 style="font-size:16px">Reimbursement history</h2>${reimbursementHistory().map(r=>`<div class="rowline"><span>${esc(r.note)}</span><span class="small">${money(repaidAmount(r))} received${remainingOwed(r)>0?' · '+money(remainingOwed(r))+' owed':''}</span></div>`).join('')||'<p class="caption">None recorded.</p>'}</div></div>`;}
function planView(){const p=activePlan(),existing=!!plan();return `<div class="notice">${existing?'Update your monthly assumptions as needed.':'Confirm this month’s suggested plan.'} The checking balance is a <b>starting snapshot</b>; do not replace it with today’s balance after recording transactions or the app will double-count them. October can begin midmonth; November can begin on November 1.</div><div class="grid2"><section class="card"><div class="sectionhead"><h2>${existing?'Edit':'Confirm'} ${monthLabel(month)} plan</h2></div><form id="planForm" class="formstack"><div class="formgroup"><div class="field"><label for="opening">Checking balance at tracking start ($)</label><input id="opening" type="number" min="0" step="0.01" required placeholder="Enter balance" value="${p.opening===null?'':p.opening}"><small>Use the available checking balance as of the tracking start date, including pending deductions already reflected by your bank.</small></div><div class="field"><label for="startDate">Tracking starts</label><input id="startDate" type="date" min="${month}-01" max="${monthEnd(month)}" value="${esc(p.startDate)}" required><small>Entries before this date will not affect this month’s totals.</small></div><div class="field"><label for="expectedIncome">Income expected during tracking period ($)</label><input id="expectedIncome" type="number" min="0" step="0.01" value="${p.expectedIncome}"><small>Exclude income already in your starting checking balance; include only ordinary income expected afterward, not reimbursements.</small></div><div class="field"><label for="bills">Unpaid bills at tracking start ($)</label><input id="bills" type="number" min="0" step="0.01" value="${p.bills}"><small>Record each payment later as a bill entry. Do not reduce this starting total after entering payments.</small></div><div class="field"><label for="loan">Live Oak / loan transfer still planned ($)</label><input id="loan" type="number" min="0" step="0.01" value="${p.loan}"><small>$500 is suggested for new months. Set $0 if already transferred before tracking starts.</small></div><div class="field"><label for="cushion">Target month-end surplus ($)</label><input id="cushion" type="number" min="0" step="0.01" value="${p.cushion}"><small>Goal only, not an expense. Suggested target: $150.</small></div></div><hr class="sep"><h2 style="font-size:16px">Category allowances</h2><p class="caption">These are amounts available from the tracking start onward. $0 in a budgeted category means no spending is allocated. Tracking-only categories have no allowance.</p><div class="formgroup">${data.categories.filter(c=>c.active).map(c=>c.mode==='budget'?`<div class="field"><label for="limit_${esc(c.id)}">${esc(c.name)} ($)</label><input id="limit_${esc(c.id)}" type="number" min="0" step="0.01" value="${num(p.limits?.[c.id])}"></div>`:`<div class="field"><label>${esc(c.name)}</label><div class="pill" style="margin-top:12px">Tracking only · no limit</div></div>`).join('')}</div><button class="btn full" type="submit">${existing?'Save changes':'Confirm monthly plan'}</button></form></section><div class="smallstack"><div class="card"><div class="sectionhead"><h2>Category settings</h2></div><p class="caption">Add, rename, reorder or archive categories. Past transactions retain their category history.</p><button class="btn secondary full" data-action="categories">Manage categories</button></div><div class="card"><div class="sectionhead"><h2>Your encrypted data</h2><span class="chip">Local vault</span></div><p class="caption">The same password and encryption format as your previous Clearledger. Backups are encrypted, but the website code is public. No cloud sync or bank connection.</p><div class="smallstack"><button class="btn secondary full" data-action="export">Export encrypted backup (.json)</button><button class="btn secondary full" data-action="import">Restore encrypted backup</button><input id="importFile" type="file" accept=".json,application/json" style="display:none"><button class="btn secondary full" data-action="lock">Lock now</button><button class="btn danger full" data-action="clear">Erase budget data on this device</button></div><p class="caption">Never upload a backup or password to GitHub. Browser storage can be cleared independently of this app.</p></div></div></div>`;}
function categories(){return `<div class="grid2"><div class="card"><div class="sectionhead"><h2>Active categories</h2><button class="btn sm" data-action="new-category">+ Add</button></div>${data.categories.filter(c=>c.active).map(c=>categoryRow(c)).join('')||'<div class="empty">No active categories.</div>'}</div><div class="card"><div class="sectionhead"><h2>Archived categories</h2></div>${data.categories.filter(c=>!c.active).map(c=>categoryRow(c)).join('')||'<div class="empty">No archived categories.</div>'}<p class="caption">Archiving hides a category from new purchases, but keeps old transactions and reports intact. Reordering applies across months.</p></div></div>`;}
function categoryRow(c){return `<div class="rowline"><div style="min-width:0"><b>${esc(c.name)}</b><div class="small">${c.mode==='tracking'?'Tracking only':'Budgeted'}${c.active?'':' · archived'}</div></div><div class="actions">${c.active?`<button class="tinybtn" data-action="up" data-id="${esc(c.id)}" aria-label="Move up">↑</button><button class="tinybtn" data-action="down" data-id="${esc(c.id)}" aria-label="Move down">↓</button>`:''}<button class="btn secondary sm" data-action="edit-category" data-id="${esc(c.id)}">Edit</button><button class="btn secondary sm" data-action="toggle-category" data-id="${esc(c.id)}">${c.active?'Archive':'Restore'}</button></div></div>`;}
function nav(){return `<nav class="bottom" aria-label="Navigation"><div class="navinner"><button data-action="home" class="${view==='home'?'active':''}"><span style="font-size:21px">⌂</span>Home</button><button data-action="activity" class="${view==='activity'?'active':''}"><span style="font-size:21px">☷</span>Activity</button><button class="addbtn" data-action="add" aria-label="Add transaction">+</button><button data-action="plan" class="${view==='plan'?'active':''}"><span style="font-size:21px">⚙</span>Plan</button><button data-action="categories" class="${view==='categories'?'active':''}"><span style="font-size:21px">≡</span>Categories</button></div></nav>`;}
function auth(){const has=!!localStorage.getItem(VAULT_KEY);const title=restorePending?'Restore backup':has?'Unlock Clearledger':'Protect Clearledger';$('app').innerHTML=`<div class="authShell"><div class="brand"><div class="brandmark">↗</div>Clearledger <span class="pill">v${VERSION}</span></div><div class="authCard"><div class="small">ENCRYPTED · LOCAL</div><h1>${title}</h1><p>${restorePending?'Enter the password for the selected backup. This will replace the vault on this device only after you confirm.':has?'Use your existing Clearledger password. No new password or reset is required.':'Create a password (at least 14 characters) to protect your budget.'}</p><form id="authForm" class="formstack"><div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" required autocomplete="${has?'current-password':'new-password'}" autofocus></div>${!has&&!restorePending?'<div class="field"><label for="authConfirm">Confirm password</label><input id="authConfirm" type="password" required autocomplete="new-password"></div>':''}<div class="authError" role="alert">${esc(authError)}</div><button class="btn full" type="submit">${restorePending?'Verify and restore':has?'Unlock':'Create encrypted vault'}</button></form><div class="smallstack" style="margin-top:14px"><button class="btn secondary full" data-action="import">Choose encrypted backup (.json)</button>${restorePending?'<button class="btn secondary full" data-action="cancel-restore">Cancel restore</button>':''}<input id="importFile" type="file" accept=".json,application/json" style="display:none"></div><p class="warning"><b>Keep your password and backup.</b> Neither GitHub nor ChatGPT can recover a forgotten password. Never enter banking credentials here.</p></div></div>`;}
function entryModal(){if(!modal)return '';if(modal.kind==='category'){const c=data.categories.find(x=>x.id===modal.id),fresh=!c;return `<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${fresh?'Add category':'Edit category'}</h2><button class="iconbtn" data-action="close">✕</button></div><form id="categoryForm" class="formstack"><div class="field"><label for="catName">Name</label><input id="catName" required maxlength="70" value="${esc(c?.name||'')}"></div><div class="field"><label for="catMode">Category type</label><select id="catMode"><option value="budget" ${c?.mode==='budget'?'selected':''}>Budgeted — monthly spending limit</option><option value="tracking" ${c?.mode==='tracking'?'selected':''}>Tracking only — no allowance</option></select></div><div class="field"><label for="catLimit">Default monthly limit ($)</label><input id="catLimit" type="number" min="0" step="0.01" value="${num(c?.limit||0)}"></div><p class="caption">Changing the type or name will not delete past transactions. The default limit is suggested for future months; existing monthly plans keep their saved limits.</p><div class="modalfoot"><button class="btn secondary" type="button" data-action="close">Cancel</button><button class="btn" type="submit">Save category</button></div></form></div></div>`;}
  if(modal.kind==='receive'){const r=data.receivables.find(x=>x.id===modal.id);if(!r)return '';const remaining=remainingOwed(r);return `<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>Record reimbursement</h2><button class="iconbtn" data-action="close">✕</button></div><form id="receiveForm" class="formstack"><p class="caption"><b>${esc(r.note)}</b> · ${money(remaining)} still owed out of ${money(r.amount)}.</p><div class="field"><label for="receivedAmount">Amount actually received ($)</label><input id="receivedAmount" type="number" required min="0.01" max="${remaining}" step="0.01" value="${remaining}"></div><p class="caption">Only the amount received increases checking. For a linked purchase, it also restores that amount of the category allowance. Any unpaid balance stays owed.</p><div class="modalfoot"><button class="btn secondary" type="button" data-action="close">Cancel</button><button class="btn" type="submit">Record payment</button></div></form></div></div>`;}
 if(modal.kind==='owed')return `<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>Add reimbursement owed</h2><button class="iconbtn" data-action="close">✕</button></div><form id="owedForm" class="formstack"><div class="field"><label for="owedNote">Who / what is this for?</label><input id="owedNote" required maxlength="90" placeholder="October 22 reimbursement"></div><div class="field"><label for="owedAmount">Amount owed ($)</label><input id="owedAmount" type="number" required min="0.01" step="0.01"></div><div class="field"><label for="owedDate">Date paid (optional)</label><input id="owedDate" type="date" value="${iso()}"></div><p class="caption">This records money owed to you without subtracting the purchase from checking again. Use this for expenses already reflected in your starting balance.</p><div class="modalfoot"><button class="btn secondary" type="button" data-action="close">Cancel</button><button class="btn" type="submit">Save owed amount</button></div></form></div></div>`;
 const t=modal.type||'expense',d=month===nowMonth()?iso():month+'-01',p=activePlan(),day=d<p.startDate?p.startDate:d;return `<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>Add an entry</h2><button class="iconbtn" data-action="close">✕</button></div><div class="typegrid">${['expense','bill','income','reserve'].map(x=>`<button type="button" data-action="entry-type" data-type="${x}" class="${x===t?'active':''}">${esc(TYPES[x])}</button>`).join('')}</div><form id="entryForm" class="formstack"><div class="field"><label for="entryAmount">Amount ($)</label><input id="entryAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label for="entryDate">Date</label><input id="entryDate" type="date" min="${month}-01" max="${monthEnd(month)}" value="${day}" required></div>${t==='expense'?`<div class="field"><label for="entryCategory">Category</label><select id="entryCategory">${data.categories.filter(c=>c.active).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div>`:''}<div class="field"><label for="entryNote">Description</label><input id="entryNote" maxlength="90" placeholder="${t==='expense'?'Lunch, groceries…':t==='reserve'?'Transfer to Live Oak':t==='income'?'Paycheck':'Phone bill'}"></div>${t==='expense'?'<label class="toggle"><input id="entryOwed" type="checkbox"> Someone will reimburse me for this purchase</label>':''}<p class="caption">${t==='reserve'?'A transfer to Live Oak reduces checking and fulfills the planned reserve, but is not a purchase.':t==='income'?'Enter actual received income; the expected-income forecast adjusts automatically.':t==='expense'?'Purchases reduce checking and the selected category’s remaining allowance. If this purchase is reimbursed, its repaid amount restores that category’s allowance when received.': 'Bill payments reduce checking and the unpaid bill total.'}</p><div class="modalfoot"><button class="btn secondary" type="button" data-action="close">Cancel</button><button class="btn" type="submit">Save entry</button></div></form></div></div>`;}
function render(){if(!unlocked){auth();return;}document.title='Clearledger v'+VERSION+' · '+monthLabel(month);$('app').innerHTML='<main class="shell">'+top()+(message?`<div class="notice warn" role="alert">${esc(message)}</div>`:'')+(view==='home'?home():view==='activity'?activity():view==='categories'?categories():planView())+'</main>'+nav()+entryModal();}
async function action(name,el){if(name==='import'){$('importFile')?.click();return;}if(name==='cancel-restore'){restorePending=null;authError='';render();return;}if(!unlocked)return;
 if(name==='lock'){lock();return;}if(name==='prev'||name==='next'){month=moveMonth(month,name==='prev'?-1:1);filter='all';modal=null;render();return;}
 if(['home','activity','plan','categories'].includes(name)){view=name;modal=null;render();return;}
 if(name==='add'){if(!plan()){view='plan';message='Confirm the monthly plan before entering transactions.';}else modal={kind:'entry',type:'expense'};render();return;}
 if(name==='entry-type'){modal={kind:'entry',type:el.dataset.type};render();return;}
 if(name==='close'){modal=null;render();return;}
 if(name==='new-category'){modal={kind:'category'};render();return;}
 if(name==='edit-category'){modal={kind:'category',id:el.dataset.id};render();return;}
 if(name==='add-owed'){modal={kind:'owed'};render();return;}
 if(name==='toggle-category'){const cid=el.dataset.id,c=data.categories.find(x=>x.id===cid);if(c&&confirm((c.active?'Archive':'Restore')+' “'+c.name+'”?'))await commit(d=>{d.categories.find(x=>x.id===cid).active=!c.active;});return;}
 if(name==='up'||name==='down'){const cid=el.dataset.id;await commit(d=>{const i=d.categories.findIndex(x=>x.id===cid),j=i+(name==='up'?-1:1);if(i>=0&&j>=0&&j<d.categories.length)[d.categories[i],d.categories[j]]=[d.categories[j],d.categories[i]];});return;}
 if(name==='delete-entry'){const eid=el.dataset.id,e=data.entries.find(x=>x.id===eid);if(!e)return;const linked=e.type==='expense'?data.receivables.filter(r=>r.entryId===eid):[];const linkedRepayment=e.type==='reimbursement'?data.receivables.find(r=>r.id===e.linkId):null;const warning=linked.length?' This also removes any linked reimbursement and its receipt transaction.':linkedRepayment?' This will reopen its linked reimbursement as owed.':'';if(confirm('Delete this transaction? Cash and allowances will be recalculated.'+warning))await commit(d=>{const removedReceivables=new Set(linked.map(r=>r.id));d.entries=d.entries.filter(x=>x.id!==eid&&!removedReceivables.has(x.linkId));d.receivables=d.receivables.filter(r=>!removedReceivables.has(r.id));if(linkedRepayment){const r=d.receivables.find(x=>x.id===linkedRepayment.id);if(r){const paid=round(d.entries.filter(x=>x.type==='reimbursement'&&x.linkId===r.id).reduce((sum,x)=>sum+num(x.amount),0));if(paid<num(r.amount)){r.status='open';delete r.receivedDate;}}}});return;}
 if(name==='remove-owed'){const rid=el.dataset.id;if(repaidAmount(data.receivables.find(r=>r.id===rid)||{id:rid})>0){alert('This reimbursement already has recorded payments. Delete the original purchase to reverse it and its payments, or delete the repayment transactions individually.');return;}if(confirm('Remove this outstanding reimbursement? This does not delete the original purchase.'))await commit(d=>{d.receivables=d.receivables.filter(r=>r.id!==rid);});return;}
  if(name==='receive'){const rid=el.dataset.id,r=data.receivables.find(x=>x.id===rid);if(!r||r.status!=='open'||remainingOwed(r)<=0)return;if(!plan()){view='plan';message='Set up the month in which you received the reimbursement first.';render();return;}modal={kind:'receive',id:rid};render();return;}
 if(name==='export'){const v=getVault();if(!v){alert('No encrypted vault found.');return;}download({...v,backedUpAt:new Date().toISOString()},'clearledger-encrypted-backup-'+iso()+'.json');return;}
 if(name==='clear'){if(confirm('Erase ALL budget entries, categories and plans on this device? You must have a backup to recover them.')&&confirm('Final confirmation: erase the budget but keep your password?'))await commit(d=>{Object.assign(d,blank());});return;}
}
function download(obj,filename){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function lockForRestore(){clearTimeout(idle);key=null;salt=null;unlocked=false;data=blank();modal=null;}
async function importFile(f){if(!f)return;try{if(f.size>4000000)throw Error('Backup too large.');restorePending=validVault(JSON.parse(await f.text()));authError='';if(unlocked)lockForRestore();render();}catch(e){alert('Could not read encrypted backup: '+e.message);}finally{if($('importFile'))$('importFile').value='';}}
async function restore(password){const v=restorePending,r=await decrypt(v,password);if(!confirm('Replace this device’s encrypted budget with the selected backup?'))return;localStorage.setItem(VAULT_KEY,JSON.stringify(v));localStorage.removeItem(OLD_KEY);data=r.data;key=r.key;salt=from64(v.salt);unlocked=true;restorePending=null;month=nowMonth();view='home';scheduleLock();render();alert('Encrypted backup restored.');}
async function savePlan(){const opening=$('opening').value;if(opening===''||!Number.isFinite(Number(opening))||Number(opening)<0)throw Error('Enter your checking balance.');const startDate=$('startDate').value;if(!/^\d{4}-\d\d-\d\d$/.test(startDate)||startDate.slice(0,7)!==month)throw Error('Select a valid start date in this month.');const prior=plan();if(prior&&data.entries.some(e=>e.date.slice(0,7)===month)&&(prior.opening!==num(opening)||prior.startDate!==startDate)){if(!confirm('Changing the starting balance or date after recording transactions can double-count or exclude activity. Continue?'))return;}
 const p={opening:num(opening),startDate,expectedIncome:num($('expectedIncome').value),bills:num($('bills').value),loan:num($('loan').value),cushion:num($('cushion').value),limits:{...activePlan().limits},confirmed:true};for(const c of data.categories.filter(c=>c.active&&c.mode==='budget'))p.limits[c.id]=num($('limit_'+c.id).value);await commit(d=>{d.plans[month]=p;});view='home';message='';render();}
async function saveCategory(){const name=$('catName').value.trim(),mode=$('catMode').value,limit=num($('catLimit').value);if(!name||name.length>70)throw Error('Enter a category name.');if(!['budget','tracking'].includes(mode))throw Error('Invalid category type.');const cid=modal.id;await commit(d=>{if(cid){const c=d.categories.find(c=>c.id===cid);if(!c)throw Error('Category not found.');c.name=name;c.mode=mode;c.limit=limit;}else{if(d.categories.length>=100)throw Error('Category limit reached.');d.categories.push({id:'c'+id().replace(/-/g,''),name,mode,limit,active:true,color:COLORS[d.categories.length%COLORS.length]});}});modal=null;view='categories';render();}
async function saveReceived(){const rid=modal?.id,r=data.receivables.find(x=>x.id===rid);if(!r||r.status!=='open')throw Error('Reimbursement is no longer outstanding.');const raw=$('receivedAmount').value,amount=Number(raw),remaining=remainingOwed(r);if(raw===''||!Number.isFinite(amount)||amount<=0||round(amount)!==amount||amount>remaining)throw Error('Enter an amount between $0.01 and the remaining balance.');const paymentDate=month===nowMonth()?iso():month+'-01';if(!plan()||paymentDate<plan().startDate)throw Error('Select a valid reimbursement month and date.');await commit(d=>{const target=d.receivables.find(x=>x.id===rid);if(!target||target.status!=='open')throw Error('Reimbursement is no longer outstanding.');const paid=round(d.entries.filter(e=>e.type==='reimbursement'&&e.linkId===rid).reduce((sum,e)=>sum+num(e.amount),0));if(round(amount)>round(num(target.amount)-paid))throw Error('Amount exceeds remaining balance.');d.entries.push({id:id(),type:'reimbursement',amount:round(amount),date:paymentDate,note:'Reimbursement: '+target.note,created:new Date().toISOString(),linkId:rid});if(round(paid+amount)>=num(target.amount)){target.status='received';target.receivedDate=paymentDate;}});modal=null;view='activity';render();}
async function saveOwed(){const note=$('owedNote').value.trim(),amount=Number($('owedAmount').value),date=$('owedDate').value;if(!note||!Number.isFinite(amount)||amount<=0)throw Error('Enter a description and positive amount.');await commit(d=>{d.receivables.push({id:id(),note,amount:num(amount),date,status:'open'});});modal=null;view='activity';render();}
async function saveEntry(){const amount=Number($('entryAmount').value),date=$('entryDate').value,type=modal.type,p=plan();if(!Number.isFinite(amount)||amount<=0||amount>1e10)throw Error('Enter a positive amount.');if(!/^\d{4}-\d\d-\d\d$/.test(date)||date.slice(0,7)!==month||date<p.startDate)throw Error('Entry date must be in the tracking period.');const note=$('entryNote').value.trim().slice(0,90),cat=type==='expense'?$('entryCategory')?.value:null;if(type==='expense'&&!data.categories.some(c=>c.id===cat&&c.active))throw Error('Choose an active category.');const reimb=type==='expense'&&$('entryOwed')?.checked;await commit(d=>{const eid=id();d.entries.push({id:eid,type,amount:num(amount),date,note,created:new Date().toISOString(),...(type==='expense'?{category:cat,reimbursable:!!reimb}:{})});if(reimb)d.receivables.push({id:id(),entryId:eid,note:note||'Purchase',amount:num(amount),date,status:'open'});});modal=null;view='home';render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();action(el.dataset.action,el).catch(err=>alert(err.message));}else if(e.target.id==='overlay'){modal=null;render();}});
document.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;try{if(e.target.id==='authForm'){const pw=$('authPassword').value;if(restorePending)await restore(pw);else if(localStorage.getItem(VAULT_KEY))await unlock(pw);else await create(pw,$('authConfirm').value);}else if(e.target.id==='planForm')await savePlan();else if(e.target.id==='categoryForm')await saveCategory();else if(e.target.id==='owedForm')await saveOwed();else if(e.target.id==='receiveForm')await saveReceived();else if(e.target.id==='entryForm')await saveEntry();}catch(err){if(e.target.id==='authForm'){authError=restorePending?'Incorrect password or invalid backup.':localStorage.getItem(VAULT_KEY)?'Could not unlock. Check your password or backup.':err.message;render();}else alert(err.message);}});
document.addEventListener('change',e=>{if(e.target.id==='importFile')importFile(e.target.files[0]);if(e.target.id==='filter'){filter=e.target.value;render();}});
window.addEventListener('pagehide',()=>{if(unlocked)lock();});document.addEventListener('pointerdown',scheduleLock);document.addEventListener('keydown',scheduleLock);document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else{if(hiddenAt&&Date.now()-hiddenAt>300000&&unlocked)lock();else scheduleLock();hiddenAt=null;}});
try{if(!crypto?.subtle||!isSecureContext)authError='A secure HTTPS connection is required for encrypted storage.';render();}catch(err){$('app').innerHTML='<div class="authShell"><div class="errorbox"><h2>Clearledger could not start</h2><p>Your encrypted data has not been erased. Do not clear browser data.</p><pre>'+esc(err.message)+'</pre></div></div>';}
})();
</script></body></html>
